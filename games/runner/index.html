<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14161c"><title>Lynx Dash · runner + tone questions</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#14161c;color:#eee;font:14px system-ui,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
#game{display:flex;flex-direction:column;flex:1;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;gap:4px;font-size:13px}#hud b{color:#fc0}
#qbar{height:6px;background:#2a2d36;border-radius:3px;overflow:hidden;margin:0 2px 6px}#qfill{height:100%;width:0;background:#5bd;transition:width .2s linear}
#cv{width:100%;aspect-ratio:400/205;flex:none;margin-top:auto;background:#1b1e27;border-radius:10px;image-rendering:pixelated;touch-action:none;display:block}
#tip{font-size:12px;color:#889;text-align:center;padding:4px}
#ctl{display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:8px 0 10px;margin-bottom:auto}#ctl button{padding:30px 0}
button{background:#2a2d36;color:#eee;border:1px solid #444a58;border-radius:12px;font-size:18px;padding:16px 0;touch-action:manipulation}button:active,button.on{background:#3d4354}
#bjump{font-size:22px;background:#24425a}#bpause{position:absolute;right:10px;top:8px;font-size:13px;padding:6px 10px}
#pw{flex:1;overflow-y:auto;padding-bottom:12px}
#ov{position:fixed;inset:0;background:rgba(10,11,15,.9);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;z-index:5}
#ov .box{background:#1d2029;border:1px solid #444a58;border-radius:14px;padding:16px;max-width:440px;width:100%;text-align:center}#ov .box button{margin:5px;font-size:15px;padding:12px 16px}
#cd{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;color:#fc0;text-shadow:0 4px 0 #000;pointer-events:none;z-index:4}
.hide{display:none!important}code{background:#000;padding:1px 4px;border-radius:4px;font-size:12px}a{color:#7cf}.k{color:#fc0;font-weight:600}
table{margin:6px auto;font-size:13px;text-align:left;border-collapse:collapse}td{padding:2px 8px}.sim{background:#a33;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px}
</style><style id="pwcss"></style></head><body>
<div id="app">
 <div id="game" class="hide">
  <div id="hud"><span>❤️ <b id="lv">3</b></span><span>Dist <b id="ds">0</b></span><span>🪙 <b id="cn">0</b></span><span>Score <b id="sc">0</b></span><span>Q <b id="qn">1</b>/<span id="qt">6</span></span><button id="bp" style="font-size:13px;padding:4px 9px">⏸</button></div>
  <div id="qbar"><div id="qfill"></div></div>
  <canvas id="cv" width="600" height="220"></canvas>
  <div id="tip">Tap = jump (hold = higher) · swipe ↓ / Duck button = duck · keys: Space/↑ jump, ↓ duck, P pause</div>
  <div id="ctl"><button id="bduck">⬇ Duck</button><button id="bjump">⤒ Jump</button></div>
 </div>
 <div id="pw" class="hide"></div>
</div>
<div id="cd" class="hide"></div>
<div id="ov"><div class="box" id="ovbox">Loading…</div></div>
<script src="../tetris/logger.js"></script><script src="../pairwise/pairwise.js"></script><script src="../pairwise/sim-chooser.js"></script>
<script src="engine.js"></script><script src="bot.js"></script><script src="../shared/qualities.js"></script><script src="session.js"></script><script src="runner.js"></script>
</body></html>
