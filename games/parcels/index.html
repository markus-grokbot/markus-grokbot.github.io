*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#14161c;color:#eee;font:14px system-ui,sans-serif;overscroll-behavior:none;overflow:hidden;position:fixed;inset:0}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;font-size:13px;color:#bbb}#hud b{color:#fff}
#field.prio{background:linear-gradient(135deg,#a0452f99 0,#a0452f00 45%),linear-gradient(225deg,#2f6aa088 0,#2f6aa000 45%),linear-gradient(45deg,#7a7a2f77 0,#7a7a2f00 45%),linear-gradient(315deg,#44445577 0,#44445500 45%),#1a1d25}
#field{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:14px;touch-action:none;background:
 radial-gradient(circle at 17.5% 19% ,#2f7a4f88 0,#2f7a4f00 34%),radial-gradient(circle at 17.5% 52.5%,#3a6fb088 0,#3a6fb000 30%),
 radial-gradient(circle at 82.5% 19%,#a08a2f88 0,#a08a2f00 34%),radial-gradient(circle at 82.5% 52.5%,#6a6a7a88 0,#6a6a7a00 30%),
 radial-gradient(circle at 50% 89%,#a0363688 0,#a0363600 34%),#1a1d25}
#field.flash{box-shadow:inset 0 0 0 3px #e55}
.zl{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:12px;color:#ddd;opacity:.75;pointer-events:none;transition:all .12s}.zl .e{font-size:22px;display:block}.zl.on{opacity:1;color:#fff;transform:translate(-50%,-50%) scale(1.25);text-shadow:0 0 8px #fff8}
.ax{position:absolute;font-size:10px;color:#889;pointer-events:none;letter-spacing:.04em;text-transform:uppercase}
#vline,#hline{position:absolute;background:#ffffff14;pointer-events:none}#vline{left:50%;top:0;bottom:0;width:1px}#hline{top:50%;left:0;right:0;height:1px}
#card{position:absolute;width:168px;margin-left:-84px;margin-top:-46px;padding:7px 9px 9px;border-radius:12px;background:#2a3040ee;border-left:6px solid #888;box-shadow:0 4px 14px #000a;pointer-events:none;display:none}
#card.held{outline:2px solid #7cf;background:#334059ee}#card .s{font-size:10px;color:#9ab}#card .h{font-weight:600;margin:2px 0;font-size:13px;line-height:1.2}#card .n{font-size:11px;color:#ccc;line-height:1.25;max-height:42px;overflow:hidden}
#card .bd{display:inline-block;font-size:9px;padding:1px 5px;border-radius:8px;background:#444;margin-left:5px;color:#fd8}
#card .bar{position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:0 0 12px 12px;background:#7cf;transform-origin:left}
#pt{position:absolute;width:16px;height:16px;margin:-8px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #7cf;pointer-events:none;display:none;z-index:2}#card.held{opacity:.88}
#card .t{position:absolute;right:7px;top:5px;font-size:11px;color:#fd8;font-variant-numeric:tabular-nums}
#read{text-align:center;font-size:11px;color:#9ab;height:16px;padding-top:2px}
#pop{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:22px;font-weight:700;color:#fd8;pointer-events:none;opacity:0;transition:opacity .3s}
#ov{position:fixed;inset:0;background:#14161cf2;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5;overflow:auto}#ov.hide,.hide{display:none!important}
#ov .box{max-width:460px;width:100%;text-align:center}#ov button{margin:6px;padding:12px 18px;border:0;border-radius:10px;background:#3b6fa0;color:#fff;font-size:15px}
.pc{background:#262b37;border-left:6px solid #888;border-radius:10px;padding:8px 10px;text-align:left;margin:6px 0}.pc .s{font-size:11px;color:#9ab}.pc .h{font-weight:600}.pc .n{font-size:12px;color:#ccc}
.ab{display:block;width:100%;text-align:left!important;background:#262b37!important;border:2px solid #445!important}.ab b{color:#fd8}
.q{text-align:left;font-size:12px;max-height:38vh;overflow:auto;margin:6px 0;border:1px solid #334;border-radius:8px}.q div{padding:4px 8px;border-bottom:1px solid #2a2f3a;display:flex;gap:8px}.q b{color:#fd8;min-width:28px;text-align:right}
table{margin:8px auto;border-collapse:collapse}td{padding:3px 8px;text-align:left}.k{color:#7cf;font-weight:600}.sim{background:#a50;color:#fff;padding:1px 6px;border-radius:6px;font-size:11px}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:#7cf;pointer-events:none}
a{color:#7cf}.tier{font-size:9px;color:#99a;text-transform:none;letter-spacing:0;transform:translateY(-50%)}
</style></head><body>
