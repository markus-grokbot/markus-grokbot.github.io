<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14161c"><title>Parcel Panic classic (v1)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#14161c;color:#eee;font:14px system-ui,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;font-size:13px;color:#bbb}#hud b{color:#fff}
#belt{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:12px;background:repeating-linear-gradient(180deg,#1c2029 0 22px,#191c24 22px 44px);touch-action:none;user-select:none}
#belt.flash{box-shadow:inset 0 0 0 3px #e55}
.card{position:absolute;left:8%;width:84%;padding:8px 10px;border-radius:10px;background:#262b37;border-left:6px solid #888;box-shadow:0 3px 8px #0008;transition:opacity .15s}
.card.tg{background:#2f3646;outline:2px solid #7cf}.card .s{font-size:11px;color:#9ab}.card .h{font-weight:600;margin:2px 0;font-size:14px}.card .n{font-size:12px;color:#ccc}
.card .bd{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#444;margin-left:6px;color:#fd8}.card .arm{position:absolute;right:8px;top:6px;font-size:12px;color:#7cf}
#bins{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 0}#bins button{padding:10px 2px;border:0;border-radius:10px;background:#2a3040;color:#eee;font-size:12px;line-height:1.2}
#bins button .e{font-size:20px;display:block}#bins button.on{background:#3b6fa0}#bins button small{display:block;font-size:9px;color:#9ab}
#pop{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:22px;font-weight:700;color:#fd8;pointer-events:none;opacity:0;transition:opacity .3s}
#ov{position:fixed;inset:0;background:#14161cf2;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}#ov.hide,.hide{display:none!important}
#ov .box{max-width:460px;width:100%;text-align:center}#ov button{margin:6px;padding:12px 18px;border:0;border-radius:10px;background:#3b6fa0;color:#fff;font-size:15px}
.ab{display:block;width:100%;text-align:left!important;background:#262b37!important;border:2px solid #445!important}.ab b{color:#fd8}
table{margin:8px auto;border-collapse:collapse}td{padding:3px 8px;text-align:left}.k{color:#7cf;font-weight:600}.sim{background:#a50;color:#fff;padding:1px 6px;border-radius:6px;font-size:11px}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800;color:#7cf;pointer-events:none}
</style></head><body>
<div id="app"><div id="hud"><span>Wave <b id="wv">1</b>/<b id="wt">4</b></span><span>Score <b id="sc">0</b></span><span>Combo <b id="cb">0</b></span><span>Speed <b id="sp">1.0</b>×</span><button id="bp" style="background:#333;color:#ccc;border:0;border-radius:8px;padding:4px 10px">❚❚</button></div>
<div id="belt"><div id="pop"></div><div id="cd" class="hide"></div></div><div id="bins"></div>
<div style="font-size:10px;color:#777;text-align:center;padding-bottom:4px">Swipe the glowing parcel: → Reply · ← Archive · ↑ Later · ↓ Spam — or tap a bin (tap twice to lock in fast). Keys 1–5.</div></div>
<div id="ov"><div class="box">Loading…</div></div>
<script src="../tetris/logger.js"></script><script src="../shared/qualities.js"></script><script src="engine.js"></script><script src="bot.js"></script><script src="session.js"></script><script src="parcels.js"></script>
</body></html>
