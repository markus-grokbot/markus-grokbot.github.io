<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><title>Combo · Tetris drops → Pairwise Pit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#111;color:#eee;font:14px system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
#tet{display:flex;flex-direction:column;flex:1;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;gap:6px}#hud b{color:#fc0}
#mid{flex:1;display:flex;gap:6px;min-height:0;justify-content:center}#board{background:#000;border:1px solid #333;height:100%;max-width:100%;aspect-ratio:1/2;touch-action:none}
#side{display:flex;flex-direction:column;gap:6px;width:76px;font-size:11px;color:#999}#next{background:#000;border:1px solid #333}
#ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 0}
button{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:10px;font-size:20px;padding:14px 0;touch-action:manipulation}button:active{background:#444}
#pw{flex:1;overflow-y:auto}#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#ov .box{background:#1c1c1c;border:1px solid #444;border-radius:12px;padding:16px;max-width:440px;width:100%;text-align:center}#ov .box button{margin:5px;font-size:15px;padding:10px 14px}
.hide{display:none!important}code{background:#000;padding:1px 4px;border-radius:4px;font-size:12px}a{color:#7cf}.k{color:#fc0;font-weight:600}table{margin:0 auto;font-size:13px;text-align:left}td{padding:2px 6px}
</style><style id="pwcss"></style></head><body>
<div id="app">
 <div id="tet" class="hide">
  <div id="hud"><span>Drops <b id="dr">0</b>/<span id="goal">0</span></span><span>Lines <b id="ln">0</b></span><span>Score <b id="sc">0</b></span></div>
  <div id="mid"><canvas id="board"></canvas><div id="side"><canvas id="next" width="70" height="70"></canvas><div id="tm">0:00</div><div id="why"></div></div></div>
  <div id="ctl"><button id="bl">◀</button><button id="br">▶</button><button id="bd">▼</button><button id="bh">⤓</button><button id="brot" style="grid-column:span 4;font-size:16px;padding:10px">⟳ rotate</button></div>
 </div>
 <div id="pw" class="hide"></div>
</div>
<div id="ov"><div class="box" id="ovbox">Loading…</div></div>
<script src="../tetris/engine.js"></script><script src="../tetris/levels.js"></script><script src="../tetris/logger.js"></script>
<script src="../tetris/droptarget.js"></script><script src="../pairwise/pairwise.js"></script><script src="session.js"></script><script src="combo.js"></script>
</body></html>
