<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111"><title>Bible Tetris · KJV verse conjunctions</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#111;color:#eee;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;gap:6px}#hud b{color:#fc0}
#mid{flex:1;display:flex;gap:6px;min-height:0;align-items:stretch;justify-content:center}
#board{background:#000;border:1px solid #333;touch-action:none;height:100%;max-width:100%;aspect-ratio:1/2}
#side{display:flex;flex-direction:column;gap:6px;width:70px}#next{background:#000;border:1px solid #333}
#ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 0}
button{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:10px;font-size:20px;padding:14px 0;touch-action:manipulation}button:active{background:#444}
.small{font-size:13px;padding:8px}#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px}
#ov .box{background:#1c1c1c;border:1px solid #444;border-radius:12px;padding:18px;max-width:420px;width:100%;text-align:center}#ov .box button{margin:5px;font-size:15px;padding:10px 14px}
.hide{display:none!important}code{background:#000;padding:1px 4px;border-radius:4px;font-size:12px}a{color:#7cf}
</style></head><body>
<div id="app">
 <div id="hud"><span>Lv <b id="lv">1</b>/10</span><span>Lines <b id="ln">0</b>/<span id="goal">0</span></span><span>Score <b id="sc">0</b></span><button class="small" id="pause">II</button></div>
 <div id="mid"><canvas id="board"></canvas><div id="side"><canvas id="next" width="70" height="70"></canvas><div style="font-size:11px;color:#999" id="tm">0:00</div><div style="font-size:11px;color:#777">tap=rotate<br>swipe ←→<br>swipe ↓=drop</div></div></div>
 <div id="ctl"><button id="bl">◀</button><button id="br">▶</button><button id="bd">▼</button><button id="bh">⤓</button><button id="brot" style="grid-column:span 4;font-size:16px;padding:10px">⟳ rotate</button></div>
</div>
<div id="ov"><div class="box" id="ovbox"></div></div>
<script src="engine.js"></script><script src="levels.js"></script><script src="logger.js"></script><script src="../shared/qualities.js"></script><script src="verses.js"></script><script src="game.js"></script>
</body></html>
