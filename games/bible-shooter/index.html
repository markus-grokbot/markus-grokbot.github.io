<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Bible Shooter · pixel conveyor puzzle</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: #111; color: #eee; font: 14px system-ui, sans-serif; touch-action: manipulation; user-select: none; }
    #app { max-width: 480px; margin: 0 auto; padding: env(safe-area-inset-top) 6px 8px; display: flex; flex-direction: column; gap: 6px; }
    #hud { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding-top: 4px; }
    #hud b { color: #fc0; }
    button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 9px; padding: 8px 10px; font-size: 14px; }
    button:active { background: #444; }
    #board { width: 100%; aspect-ratio: 1 / 1; display: block; background: #050505; border-radius: 8px; touch-action: manipulation; }
    #park, #lanes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .slot { height: 46px; border: 1px dashed #444; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
    .lane { background: #181818; border: 1px solid #2a2a2a; border-radius: 9px; padding: 4px; display: flex; flex-direction: column; gap: 4px; align-items: center; min-height: 120px; }
    .sh { width: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #111; border: 2px solid rgba(0,0,0,.5); }
    .sh.top { height: 52px; font-size: 18px; cursor: pointer; box-shadow: 0 0 0 2px #fff3; }
    .sh.next { height: 22px; font-size: 11px; opacity: .55; }
    .sh.disabled { filter: grayscale(.6) brightness(.6); }
    #ov { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; padding: 18px; }
    #ov .box { background: #1c1c1c; border: 1px solid #444; border-radius: 12px; padding: 16px; max-width: 420px; width: 100%; text-align: center; }
    #ov .box button { margin: 4px; }
    .hide { display: none !important; }
    .muted { color: #888; font-size: 12px; }
    a { color: #7cf; }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <span>Lv <b id="lv">1</b>/5</span><span>Pixels <b id="px">0</b></span><span id="tm">0:00</span>
      <button id="menu">☰</button>
    </div>
    <canvas id="board"></canvas>
    <div class="muted">Parking (tap to send back on the belt)</div>
    <div id="park"></div>
    <div id="lanes"></div>
  </div>
  <div id="ov"><div class="box" id="ovbox"></div></div>
  <script src="../bible-tetris/logger.js"></script>
  <script src="engine.js"></script>
  <script src="bots.js"></script>
  <script src="generator.js"></script>
  <script src="game.js"></script>
</body>
</html>
