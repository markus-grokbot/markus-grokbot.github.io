<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lo · Preferences (Lynx Dash)</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#14161c;color:#eee;font:14px system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:8px}#hud{display:flex;justify-content:space-between;padding:6px 2px}#hud b{color:#fc0}
#bar{height:6px;background:#2a2d36;border-radius:3px;overflow:hidden}#fill{height:100%;width:0;background:#5bd}
canvas{width:100%;aspect-ratio:600/220;background:#1b1e27;border-radius:10px;display:block;margin-top:6px;touch-action:none}
button{background:#2a2d36;color:#eee;border:1px solid #444a58;border-radius:10px;font-size:15px;padding:10px 14px;margin:4px;cursor:pointer}button:hover{background:#3d4354}
#ctl{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:8px}#ctl button{padding:24px 0;font-size:18px}
#ov{position:fixed;inset:0;background:rgba(10,11,15,.92);display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.box{background:#1d2029;border:1px solid #444a58;border-radius:14px;padding:16px;max-width:480px;width:100%;max-height:100%;overflow-y:auto}
.hide{display:none!important}.k{color:#fc0;font-weight:600}.area{display:block;padding:4px 0;text-align:left}.small{font-size:12px;color:#99a}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:#334}.strong{background:#2a6;color:#fff}.p2{background:#a72}
.opts button{display:block;width:100%;text-align:left}.scale button{min-width:54px}
</style></head><body>
<div id="app"><div id="game" class="hide">
 <div id="hud"><span>❤️ <b id="lv">3</b></span><span>Score <b id="sc">0</b></span><span>⏱ <b id="tl">30</b>s</span><span>Card <b id="qn">0</b>/<b id="qt">0</b></span><button id="bp">⏸</button></div>
 <div id="bar"><div id="fill"></div></div><canvas id="cv" width="600" height="220"></canvas>
 <div class="small" style="text-align:center">Space/↑/tap = jump · ↓ = duck · P = pause · cards: number keys</div>
 <div id="ctl"><button id="bduck">⬇ Duck</button><button id="bjump">⤒ Jump</button></div></div></div>
<div id="ov"><div class="box" id="box">Loading…</div></div>
<script src="data/areas.js"></script><script src="engine.js"></script><script src="prefs.js"></script><script src="timer.js"></script><script src="game.js"></script>
</body></html>
