<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#111"><title>Bible Tycoon</title><style>*{box-sizing:border-box}html,body{margin:0;background:#111;color:#eee;font:14px system-ui,sans-serif}body{touch-action:manipulation}#app{max-width:620px;margin:auto;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}h1{font-size:20px;margin:8px 0}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.card{background:#1d1d1d;border:1px solid #383838;border-radius:9px;padding:7px}.card b{color:#fc0;font-size:18px}#board{display:block;width:100%;margin:8px 0;background:#050505;border:1px solid #444;border-radius:8px;touch-action:manipulation}.buttons{display:flex;gap:6px;flex-wrap:wrap}button{background:#2a2a2a;color:#eee;border:1px solid #555;border-radius:9px;padding:10px 12px;font-weight:600}button:active{background:#555}input{display:none}.panel{background:#191919;border:1px solid #333;border-radius:9px;padding:9px;margin:8px 0}.features{color:#bbb;font-size:12px;line-height:1.5}.log{color:#aaa;font-size:12px;height:24px}.hide{display:none!important}#end{position:fixed;inset:0;background:#000d;padding:18px;overflow:auto}#end .box{max-width:560px;margin:10px auto;background:#202020;border:1px solid #555;border-radius:12px;padding:15px}blockquote{margin:8px 0;padding:8px;border-left:3px solid #fc0;color:#ddd;font-size:13px}</style></head><body><main id="app"><h1>⛏ Bible Tycoon</h1><div class="hud"><div class="card">Coins<br><b id="coins">0</b></div><div class="card">Workers<br><b id="workers">0</b></div><div class="card">Efficiency<br><b id="eff">1×</b></div><div class="card">Multiplier<br><b id="mult">1×</b></div><div class="card">Factories<br><b id="factories">0</b></div><div class="card">Tick<br><b id="tick">0</b></div></div><canvas id="board" width="600" height="400"></canvas><div class="buttons"><label><button>Load seed</button><input id="file" type="file" accept=".json,application/json"></label><button id="sample">Use sample seed</button><button id="endBtn">End session</button></div><div class="panel"><b>Active features</b><div id="features" class="features">Load a Bible Tetris seed to begin.</div></div><div id="log" class="log"></div></main><div id="end" class="hide"><div class="box"><h2>Session complete</h2><div id="report"></div><button id="close">Close</button> <button id="download">Download log</button></div></div><script src="tycoon.js"></script></body></html>
